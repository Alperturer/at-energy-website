name: Site controleren
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Site opnieuw bouwen
        run: python3 build.py
      - name: Links, SEO en structuur testen
        run: python3 tests/check_site.py
      - name: Contactfunctie syntaxcheck
        run: node --check api/contact.js
